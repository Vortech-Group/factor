<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t">
  <title id="t">Laravel Factor by Vortech</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="#08090a"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="400" fill="#CF000F"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="128" fill="#8b8c8a" font-size="18" font-weight="600" letter-spacing="4">VORTECH  /  LARAVEL PACKAGE</text>
    <text x="80" y="212" fill="#f4f4f2" font-size="72" font-weight="800" letter-spacing="-2">Laravel <tspan fill="#CF000F">Factor</tspan></text>
    <text x="80" y="266" fill="#8b8c8a" font-size="24">Exact, arbitrary-precision math:</text>
    <text x="80" y="300" fill="#8b8c8a" font-size="24">derivatives, integrals, equations.</text>
  </g>

  <!-- code mock -->
  <g transform="translate(750,48)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15">
    <rect width="470" height="304" rx="12" fill="#0c0d0e" stroke="#575856" stroke-opacity=".6"/>
    <rect width="470" height="40" rx="12" fill="#ffffff" fill-opacity=".04"/>
    <circle cx="24" cy="20" r="5" fill="#575856"/>
    <circle cx="42" cy="20" r="5" fill="#575856"/>
    <circle cx="60" cy="20" r="5" fill="#575856"/>

    <text x="24" y="76" fill="#8b8c8a">Factor::<tspan fill="#f4f4f2">derivative</tspan>(<tspan fill="#CF000F">'x^3 * sin(x)'</tspan>)</text>
    <text x="24" y="100" fill="#CF000F">x^3*cos(x) + 3*x^2*sin(x)</text>

    <text x="24" y="140" fill="#8b8c8a">Factor::<tspan fill="#f4f4f2">solve</tspan>(<tspan fill="#CF000F">'x^2 - 2 = 0'</tspan>)</text>
    <text x="24" y="164" fill="#CF000F">-sqrt(2), sqrt(2)</text>

    <text x="24" y="204" fill="#8b8c8a">Number::<tspan fill="#f4f4f2">of</tspan>(<tspan fill="#CF000F">'0.1'</tspan>)-&gt;<tspan fill="#f4f4f2">add</tspan>(<tspan fill="#CF000F">'0.2'</tspan>)</text>
    <text x="24" y="228" fill="#CF000F">0.3</text>

    <line x1="24" y1="252" x2="446" y2="252" stroke="#575856" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <rect x="24" y="268" width="236" height="24" rx="12" fill="#CF000F"/>
    <text x="142" y="285" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">EXACT &#183; 40+ DIGITS</text>
  </g>
</svg>
